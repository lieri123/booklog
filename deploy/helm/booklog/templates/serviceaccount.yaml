{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "booklog.serviceAccountName" . }}
  labels:
    {{- include "booklog.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app talks only to Postgres, so this needs no AWS permissions at all -
# the same reason the ECS task role is empty.
automountServiceAccountToken: false
{{- end }}
