{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booklog.secretName" . }}
  labels:
    {{- include "booklog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKeys.password }}: {{ required "\n\nbooklog: set database.password, or point database.existingSecret at a Secret holding the RDS credentials.\n" (default (and .Values.devPostgres.enabled .Values.devPostgres.password) .Values.database.password) | quote }}
  {{ .Values.database.secretKeys.jwtSecret }}: {{ include "booklog.jwtSecret" . | quote }}
{{- end }}
