apiVersion: v1
kind: Service
metadata:
  name: {{ include "booklog.fullname" . }}
  labels:
    {{- include "booklog.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- if or .Values.service.annotations (and .Values.loadBalancer.enabled .Values.loadBalancer.annotations) }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.loadBalancer.enabled }}
    {{- toYaml .Values.loadBalancer.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ if .Values.loadBalancer.enabled }}LoadBalancer{{ else }}{{ .Values.service.type }}{{ end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and .Values.service.nodePort (eq .Values.service.type "NodePort") }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "booklog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
