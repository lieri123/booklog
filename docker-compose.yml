services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booktracker
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: booktracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booktracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
