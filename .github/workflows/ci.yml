name: CI

on:
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t booklog:${{ github.sha }} .
      - name: Report image size
        run: docker images booklog:${{ github.sha }} --format "{{.Size}}"