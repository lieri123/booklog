name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1
  ECS_CLUSTER: booklog-dev
  ECS_SERVICE: booklog-dev
  TASK_FAMILY: booklog-dev
  CONTAINER_NAME: app

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    runs-on: ubuntu-latest
    needs: test


    steps:
      - uses: actions/checkout@v4
    
      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check stack is up
        id: guard
        run: |
          # The dev stack is destroyed between working sessions to control
          # cost. A push while it is down should skip the deploy rather than
          # fail it. A workflow that is red on every commit stops carrying
          # any signal.
          set +e
          OUT=$(aws ecr describe-repositories --repository-names booklog-dev \
                  --region ${{ env.AWS_REGION }} 2>&1)
          RC=$?
          set -e

          if [ $RC -eq 0 ]; then
            echo "up=true" >> $GITHUB_OUTPUT
          elif echo "$OUT" | grep -q "RepositoryNotFoundException"; then
            echo "up=false" >> $GITHUB_OUTPUT
            echo "::notice title=Deploy skipped::ECR repository booklog-dev not found, so the infrastructure is torn down. Run 'tofu apply' and re-run this workflow to deploy."
          else
            # Anything else, including AccessDenied, is a real failure and must
            # not be silently treated as a torn-down stack.
            echo "$OUT"
            exit 1
          fi

      - name: Log in to ECR
        id: ecr
        if: steps.guard.outputs.up == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        if: steps.guard.outputs.up == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: booklog-dev
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$TAG .
          docker push $REGISTRY/$REPOSITORY:$TAG
          echo "IMAGE=$REGISTRY/$REPOSITORY:$TAG" >> $GITHUB_ENV

      - name: Render task definition
        id: taskdef
        if: steps.guard.outputs.up == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_FAMILY }} \
            --query taskDefinition > taskdef.json
          # Strip fields the API returns but won't accept back.
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)' \
            taskdef.json > clean.json
          jq --arg IMAGE "$IMAGE" \
            '(.containerDefinitions[] | select(.name=="${{ env.CONTAINER_NAME }}") | .image) = $IMAGE' \
            clean.json > new.json
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT

      - name: Run migrations
        if: steps.guard.outputs.up == 'true'
        run: |
          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=booklog-dev-private-*" \
            --query "Subnets[].SubnetId" --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=booklog-dev-app" \
            --query "SecurityGroups[0].GroupId" --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition ${{ steps.taskdef.outputs.arn }} \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"${{ env.CONTAINER_NAME }}","command":["python","main.py","--migrate"]}]}' \
            --query "tasks[0].taskArn" --output text)

          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ARN

          EXIT=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ARN \
            --query "tasks[0].containers[0].exitCode" --output text)
          echo "migration exit code: $EXIT"
          [ "$EXIT" = "0" ] || exit 1

      - name: Deploy
        if: steps.guard.outputs.up == 'true'
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.taskdef.outputs.arn }} \
            --query "service.serviceName" --output text

      - name: Wait for stability
        if: steps.guard.outputs.up == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Smoke test
        if: steps.guard.outputs.up == 'true'
        run: |
          ALB=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?starts_with(LoadBalancerName, 'bklog-')].DNSName | [0]" \
            --output text)
          bash scripts/smoke.sh "http://$ALB"
